name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests and PHPStan (PHP ${{ matrix.php }}, ${{ matrix.dependency-versions }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependency-versions: [highest]
        include:
          - php: '8.4'
            dependency-versions: lowest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          # 'highest' runs composer update, so the matrix tests against the
          # newest PHPStan/PHPUnit rather than the committed lock file.
          dependency-versions: ${{ matrix.dependency-versions }}

      - name: Run tests
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict
